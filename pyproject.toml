[project]
name = "pharma-sales-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Fath", email = "andrew.w.fath@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt>=2.0.8",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
]

[project.scripts]
